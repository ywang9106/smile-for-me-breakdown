<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smile for Me 分场与资产拆解</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
/* Layout: production-office breakdown tool. Header + tiles, then tabbed views (scenes / assets / open questions), right-side editing drawer. */
:root{
  --paper:#eef1f5; --surface:#ffffff; --ink:#152033; --muted:#5b6779; --line:#d6dce5;
  --accent:#1e3a6e; --accent-ink:#ffffff; --sakura:#c4587a; --soft:#e4e9f1;
  --f-display:"Noto Serif SC","Songti SC",serif; --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; --f-mono:"Courier Prime","Courier New",monospace;
  --st-int:#ffffff; --st-ext:#fff1a8; --st-night:#cfe0ff; --st-home:#ffd9b5; --st-dream:#ddd6fa; --st-ink:#152033;
  --c-char:#1e3a6e; --c-set:#4b5d73; --c-prop:#9a5b00; --c-ward:#b0466a; --c-vfx:#6a46b8; --c-sound:#137a7a;
  --ok:#1f7a45; --warn:#a86400; --bad:#b3261e;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f141c; --surface:#171e29; --ink:#e5ebf3; --muted:#9aa6b8; --line:#2b3545;
    --accent:#8fb2ee; --accent-ink:#0f141c; --sakura:#ec97b1; --soft:#1f2836;
    --st-int:#232c3a; --st-ext:#4a4317; --st-night:#1f3358; --st-home:#4d3420; --st-dream:#352d5a; --st-ink:#e5ebf3;
    --c-char:#8fb2ee; --c-set:#a9b6c8; --c-prop:#e0a64a; --c-ward:#ec97b1; --c-vfx:#b59cf0; --c-sound:#5cc8c8;
    --ok:#5fcf8c; --warn:#f0b04a; --bad:#ff8a80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f141c; --surface:#171e29; --ink:#e5ebf3; --muted:#9aa6b8; --line:#2b3545;
  --accent:#8fb2ee; --accent-ink:#0f141c; --sakura:#ec97b1; --soft:#1f2836;
  --st-int:#232c3a; --st-ext:#4a4317; --st-night:#1f3358; --st-home:#4d3420; --st-dream:#352d5a; --st-ink:#e5ebf3;
  --c-char:#8fb2ee; --c-set:#a9b6c8; --c-prop:#e0a64a; --c-ward:#ec97b1; --c-vfx:#b59cf0; --c-sound:#5cc8c8;
  --ok:#5fcf8c; --warn:#f0b04a; --bad:#ff8a80;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding:20px 20px 60px;display:flex;flex-direction:column;gap:16px}

/* header */
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.ttl h1{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1.15;margin:0;letter-spacing:.01em;text-wrap:balance}
.ttl h1 em{font-style:normal;color:var(--sakura)}
.ttl .meta{color:var(--muted);font-size:13px;margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.savestate{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.savestate .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.savestate.dirty .dot{background:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12.5px}
[hidden]{display:none!important}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.tile .n{font-family:var(--f-display);font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .l{color:var(--muted);font-size:12.5px}
.tile.warn .n{color:var(--warn)}

/* tabs */
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav.tabs a{padding:9px 16px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:500}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
nav.tabs a .cnt{font-size:11.5px;background:var(--soft);border-radius:10px;padding:1px 7px;margin-left:6px;color:var(--muted);font-variant-numeric:tabular-nums}

/* toolbars */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grow{flex:1}
.field{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.field select,.field input,.search{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;color:var(--ink)}
.search{min-width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.filterchip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:3px 4px 3px 10px;font-size:12.5px}
.filterchip button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0 6px;font-size:14px;line-height:1}
.catbar{display:flex;flex-wrap:wrap;gap:6px}
.catbar button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:5px 12px;cursor:pointer;font-size:13px}
.catbar button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.catbar button .cnt{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}

/* tables */
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:1100px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;font-weight:500;color:var(--muted);background:var(--soft);position:sticky;top:0;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
tbody tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td.no{font-family:var(--f-mono);font-weight:700;font-size:15px;white-space:nowrap;border-left:6px solid var(--line)}
tr.st-int td.no{border-left-color:color-mix(in srgb,var(--st-int) 60%,var(--line))}
tr.st-ext td.no{border-left-color:#e7c62e}
tr.st-night td.no{border-left-color:#5c86d6}
tr.st-home td.no{border-left-color:#e08a3c}
tr.st-dream td.no{border-left-color:#8a74e0}
tr.sub td{background:color-mix(in srgb,var(--soft) 55%,transparent)}
td.sl{min-width:240px}
.slug{font-family:var(--f-mono);font-weight:700;font-size:13.5px;letter-spacing:.01em}
.subtags{color:var(--muted);font-size:12px;margin-top:3px}
.sum{min-width:300px;max-width:440px}
.note{margin-top:5px;font-size:12px;color:var(--warn)}
.note::before{content:"待思考 · ";font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:1px 7px;font-size:12px;border:1px solid color-mix(in srgb,var(--cc) 35%,transparent);background:color-mix(in srgb,var(--cc) 10%,transparent);color:var(--cc);cursor:pointer;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{font-family:var(--f-mono);font-weight:700}
.chip:hover{background:color-mix(in srgb,var(--cc) 20%,transparent)}
.cat-char{--cc:var(--c-char)} .cat-set{--cc:var(--c-set)} .cat-prop{--cc:var(--c-prop)} .cat-ward{--cc:var(--c-ward)} .cat-vfx{--cc:var(--c-vfx)} .cat-sound{--cc:var(--c-sound)} .cat-style{--cc:var(--sakura)}
.pill{display:inline-block;border-radius:11px;padding:1px 9px;font-size:12px;white-space:nowrap;border:1px solid var(--line);background:var(--soft);color:var(--muted)}
.pill.s-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.pill.s-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.pill.s-info{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.pill.s-off{text-decoration:line-through}
.pri{font-weight:700;font-size:12px}
.pri-高{color:var(--bad)} .pri-中{color:var(--warn)} .pri-低{color:var(--muted)}
td select.inline{border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 4px;font-size:12.5px;cursor:pointer}
td select.inline:hover{border-color:var(--line);background:var(--surface)}
.bar{height:5px;border-radius:3px;background:var(--soft);margin-top:4px;overflow:hidden;width:90px}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* stripboard */
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:10px;border-radius:2px;border:1px solid var(--line);display:inline-block}
.board{display:flex;flex-direction:column;gap:3px}
.strip{display:grid;grid-template-columns:28px 64px 52px minmax(240px,1.3fr) 110px 120px minmax(200px,1fr) 64px;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:6px;color:var(--st-ink);cursor:grab;background:var(--st-int)}
.strip.st-ext{background:var(--st-ext)} .strip.st-night{background:var(--st-night)} .strip.st-home{background:var(--st-home)} .strip.st-dream{background:var(--st-dream)}
.strip .grip{color:var(--muted);font-size:16px;text-align:center;user-select:none}
.strip .sno{font-family:var(--f-mono);font-weight:700;font-size:15px}
.strip .ssl{font-family:var(--f-mono);font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .sm{font-size:12px;opacity:.8}
.strip .ids{font-family:var(--f-mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .mv{display:flex;gap:2px;justify-content:flex-end}
.strip .mv button{border:1px solid var(--line);background:var(--surface);border-radius:4px;width:26px;height:24px;cursor:pointer;padding:0;color:var(--ink)}
.strip.dragging{opacity:.4}
.strip.drop-before{box-shadow:0 -3px 0 var(--sakura)}
.strip.drop-after{box-shadow:0 3px 0 var(--sakura)}
.daybreak{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--ink);color:var(--paper);border-radius:6px;cursor:grab;flex-wrap:wrap}
.daybreak input{background:transparent;border:1px dashed color-mix(in srgb,var(--paper) 40%,transparent);color:var(--paper);border-radius:5px;padding:3px 8px;font-weight:700;min-width:180px}
.daybreak .tot{font-size:12.5px;opacity:.8;font-variant-numeric:tabular-nums}
.daybreak .grow{flex:1}
.daybreak button{background:transparent;border:1px solid color-mix(in srgb,var(--paper) 40%,transparent);color:var(--paper);border-radius:4px;cursor:pointer;padding:2px 8px}
.daybreak.drop-before{box-shadow:0 -3px 0 var(--sakura)} .daybreak.drop-after{box-shadow:0 3px 0 var(--sakura)}
.boardbox{overflow-x:auto}
.boardbox .board{min-width:980px}

/* issues */
.issue{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.issue .ihead{display:flex;gap:8px;align-items:center}
.issue .ihead .ref{flex:1;min-width:0;font-size:12.5px;color:var(--muted)}
.issue textarea,.issue input[type=text]{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 7px;resize:vertical;min-height:34px}
.issue textarea:hover,.issue input[type=text]:hover,.issue textarea:focus,.issue input[type=text]:focus{border-color:var(--line);background:var(--paper)}
.issue textarea{field-sizing:content}
.issue .iq{font-weight:700;font-size:15px}
.issue .ith{display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--line);padding-left:8px}
.issue .ith span{font-size:12px;color:var(--muted);padding-left:7px}
.issue .del{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px}
.issues{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:10px}
@media (max-width:480px){.issues{grid-template-columns:1fr}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.35);z-index:20}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;box-shadow:-12px 0 30px rgba(0,0,0,.12)}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer .dh h2{margin:0;font-family:var(--f-display);font-size:19px;text-wrap:balance}
.drawer .db{overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.drawer .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 12px}
.fl{display:flex;flex-direction:column;gap:4px}
.fl > span{font-size:12px;color:var(--muted)}
.fl input,.fl select,.fl textarea{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:7px 9px;width:100%}
.fl textarea{resize:vertical;min-height:90px;line-height:1.55}
.fl input.mono{font-family:var(--f-mono);font-weight:700}
.eighths{display:flex;gap:6px;align-items:center}
.eighths input{width:64px} .eighths select{width:80px}
.picker{display:flex;flex-direction:column;gap:10px}
.picker h4{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:500}
.picker .opts{display:flex;flex-wrap:wrap;gap:5px}
.picker .opt{border:1px dashed var(--line);background:transparent;border-radius:5px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.picker .opt b{font-family:var(--f-mono)}
.picker .opt[aria-pressed="true"]{border-style:solid;border-color:color-mix(in srgb,var(--cc) 50%,transparent);background:color-mix(in srgb,var(--cc) 14%,transparent);color:var(--cc)}
.confirm{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--bad)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;z-index:40;font-size:13px;max-width:90vw}

@media (max-width:640px){
  .wrap{padding:16px 16px 50px}
  .ttl h1{font-size:24px}
  .grid2,.grid3{grid-template-columns:1fr}
  .search{min-width:0;flex:1}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="ttl">
      <h1>Smile for Me <em>·</em> 分场与资产拆解</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="actions">
      <span class="savestate" id="savestate"><span class="dot"></span><span id="savetext">已是最新</span></span>
      <button class="btn ghost sm" id="discard" hidden>放弃本地修改</button>
      <button class="btn sm" id="copyBtn" title="复制当前标签页的表格，可直接粘贴到 Excel / 飞书 / Google 表格">复制表格</button>
      <button class="btn sm" id="dlBtn" hidden>下载 CSV</button>
      <button class="btn sm" id="impJson" hidden title="载入别人发来的数据文件，替换当前内容">导入数据</button>
      <button class="btn sm" id="expJson" hidden title="把当前全部内容存成一个数据文件，可发给别人导入">导出数据</button>
      <button class="btn primary" id="expHtml" hidden title="下载一份带着当前修改的网页文件，可以直接转发">下载含修改的网页</button>
      <input type="file" id="impFile" accept=".json,application/json" hidden>
      <button class="btn primary" id="saveBtn" disabled title="把修改保存到这个页面，所有能打开链接的人都会看到">保存到页面</button>
    </div>
  </header>

  <section class="tiles" id="tiles" aria-label="概览"></section>

  <nav class="tabs" aria-label="视图">
    <a href="#scenes" data-view="scenes">Scene Breakdown 分场<span class="cnt" id="cnt-scenes"></span></a>
    <a href="#assets" data-view="assets">资产 Breakdown<span class="cnt" id="cnt-assets"></span></a>
    <a href="#issues" data-view="issues">待思考<span class="cnt" id="cnt-issues"></span></a>
  </nav>

  <!-- scenes -->
  <section id="v-scenes" class="view">
    <div class="toolbar">
      <div class="seg" role="group" aria-label="显示方式">
        <button id="m-table" aria-pressed="true">分场表</button>
        <button id="m-strip" aria-pressed="false">场景条 / 生产顺序</button>
      </div>
      <input class="search" id="sq" type="search" placeholder="搜索标题、摘要、备注…" aria-label="搜索分场">
      <label class="field">地点 <select id="f-loc"></select></label>
      <label class="field">类型 <select id="f-kind"></select></label>
      <label class="field">状态 <select id="f-status"></select></label>
      <span id="f-asset-holder"></span>
      <span class="grow"></span>
      <button class="btn sm" id="addScene">+ 新增场次</button>
    </div>
    <div id="sceneTable"></div>
    <div id="stripBoard" hidden>
      <div class="toolbar" style="margin-bottom:10px">
        <div class="legend" id="legend"></div>
        <span class="grow"></span>
        <button class="btn sm" id="addBreak">+ 批次分隔</button>
        <button class="btn sm" id="groupLoc">按场景分组</button>
        <button class="btn sm" id="resetOrder">恢复剧本顺序</button>
      </div>
      <div class="boardbox"><div class="board" id="board"></div></div>
      <p class="meta" style="color:var(--muted);font-size:12.5px">拖动条带或用 ↑ ↓ 调整生产顺序；分隔条上显示该批次的镜头数和页数合计。插入场（12A 等）页数含在母场内。</p>
    </div>
  </section>

  <!-- assets -->
  <section id="v-assets" class="view" hidden>
    <div class="toolbar">
      <div class="catbar" id="catbar"></div>
      <input class="search" id="aq" type="search" placeholder="搜索名称、描述…" aria-label="搜索资产">
      <span class="grow"></span>
      <button class="btn sm" id="addAsset">+ 新增资产</button>
    </div>
    <div id="assetTable"></div>
  </section>

  <!-- issues -->
  <section id="v-issues" class="view" hidden>
    <div class="toolbar">
      <span class="meta" style="color:var(--muted)">制作过程中要持续思考的问题。有了想法就记在“当前想法”里，想法可以随制作推进不断改。</span>
      <span class="grow"></span>
      <button class="btn sm" id="addIssue">+ 新增问题</button>
    </div>
    <div class="issues" id="issueList"></div>
  </section>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
  <div class="dh"><h2 id="dTitle"></h2><button class="btn sm" id="dClose">关闭</button></div>
  <div class="db" id="dBody"></div>
  <div class="df" id="dFoot"></div>

"春", "kind": "现实", "day": "春日（终日）", "summary": "高处樱花已满开。女儿站在树下拿着一小枝开花的樱花，抬头看了一会儿，转身跑向回廊，Pen Pen 跟上。", "assets": ["C01", "C07", "P14", "W02", "X08"], "note": "", "status": "草稿", "shots": 7}, {"id": "s18", "no": "18", "page": "14–15", "eighths": 3, "slug": "INT. SECRET BEDROOM DOORWAY - CONTINUOUS", "ie": "内", "loc": "L04", "tod": "日", "season": "春", "kind": "现实", "day": "春日（终日）", "summary": "门开，复制体走出，开衫袖口下露出包着皮肤的手。屋里李博士躺着，胸口随呼吸设备微微起伏。屏幕上是女儿手持摄像机拍的父亲独自站在巨大冰川前，身影渺小孤独，“Daddy! Daddy——”。门关上，录像声和呼吸声被关在门后。", "assets": ["C08", "C05", "L03", "P02", "P08", "P13", "W05", "S01", "S05"], "note": "", "status": "草稿", "shots": 7}, {"id": "s18A", "no": "18A", "page": "15", "eighths": 0, "slug": "EXT. GLACIER - DAY (HOME MOVIE · 插入)", "ie": "外", "loc": "L07", "tod": "日", "season": "—", "kind": "家庭录像", "day": "回忆", "summary": "女儿主观镜头：父亲独自站在巨大冰川前，身影渺小，很孤独。（第16场屏幕上的冰川全景也可同场拍摄）", "assets": ["C06", "W04", "X05", "S05"], "note": "页数含在第18场内", "status": "草稿", "shots": 2}, {"id": "s19", "no": "19", "page": "15–16", "eighths": 7, "slug": "INT. CORRIDOR - CONTINUOUS", "ie": "内", "loc": "L01", "tod": "日", "season": "春", "kind": "现实", "day": "春日（终日）", "summary": "与开场同方向。女儿赤脚举着樱花枝在回廊奔跑喊爸爸，Pen Pen 摇摆跟在后面。回廊尽头这次是一个站着的身影。她慢下、停住，看他的腿，慢慢抬头。复制体从阴影里走出，带着温暖灿烂的笑伸出手：“过来。”她跑过去，被稳稳抱高，惊喜地笑。没有吃力的呼吸声。“Smile for me, my girl. Smile for Daddy.” Pen Pen 停在一旁安静等待。庭院樱花盛开。切黑。", "assets": ["C01", "C08", "C07", "L02", "P14", "W02", "W05", "X08", "X09", "X10"], "note": "当前方向：全片只有一台 Pen Pen。剧本末句“The penguins continue working along the corridor”用了复数，建议改为单数", "status": "草稿", "shots": 20}], "order": ["s1", "s2", "s3", "s4", "s5", "s6", "s7", "s8", "s9", "s10", "s11", "s12", "s12A", "s12B", "s12C", "s13", "s14", "s15", "s16", "s17", "s18", "s18A", "s19"], "issues": [{"id": "q16", "text": "全片的美术风格是什么方向？", "thought": "风格基准图（Y01）还没定，它卡着所有设定图。", "ref": "Y01", "state": "尚无方向"}, {"id": "q3", "text": "李博士的三种状态（病中 / 年轻 / 复制体）怎么保持是同一张脸？复制体“像他但更年轻、更好”的分寸在哪？", "thought": "可以照女儿的办法：先定一个基准版本再推导。以哪个为基准还没想。", "ref": "C05, C06, C08", "state": "尚无方向"}, {"id": "q4", "text": "巨脸学笑的微表情怎么做出来？这是全片的核心表演。", "thought": "3D 建模能定尺度和机位；表情本身建议尽早单独做测试镜头。", "ref": "C09, X02", "state": "尚无方向"}, {"id": "q6", "text": "女儿四个年龄段怎么让观众认出是同一个孩子？", "thought": "先定出现率最高的 6 岁（C01），再以她的长相为基准生图推导其他年龄段。推导出来像不像，要在制作中看。", "ref": "C01–C04, Y02", "state": "有初步方向"}, {"id": "q11", "text": "生成管线怎么搭？", "thought": "参考 Higgsfield 两个开源项目（Passport Rush、The Coat）：美术设定图 → 3D 建模 → 生图 → 生视频。每一步的衔接要在测试镜头里跑通。", "ref": "Y05", "state": "有初步方向"}, {"id": "q18", "text": "图片和视频各用什么模型？", "thought": "还没选。", "ref": "Y05", "state": "尚无方向"}, {"id": "q12", "text": "配音和口型怎么做？三个“李博士的声音”怎么保持一致？", "thought": "英语。先生成画面，再用 ElevenLabs 配音并对口型。说话镜头的时长够不够放台词、后对口型的效果，要边做边看。", "ref": "X09, S02", "state": "有初步方向"}, {"id": "q14", "text": "接触类动作（推嘴角、抱起李博士、抱起女儿）怎么不穿帮？", "thought": "先用 Blender 做 previs，再生成。", "ref": "X10", "state": "有初步方向"}, {"id": "q13", "text": "成片多长？画幅、分辨率、帧率？", "thought": "目标 13–15 分钟，当前约 273 个镜头、按每镜头 3 秒约 14 分钟。画幅、分辨率、帧率还没定。", "ref": "Y04", "state": "有初步方向"}, {"id": "q2", "text": "卧室几场戏的光照基调？", "thought": "第 4 场是夜景。第 6、8、9、10 场在剧本里承接它（CONTINUOUS），暂时也按夜景，第 9 场女儿就是夜里站在门外。", "ref": "4, 6, 8, 9, 10", "state": "有初步方向"}, {"id": "q10", "text": "女儿的服装怎么随季节变？", "thought": "冬天穿冬季和服（深蓝、企鹅刺绣），春天换春季和服。春季和服的款式和配色还没定。", "ref": "W01, W02", "state": "有初步方向"}, {"id": "q1", "text": "片中有几台企鹅机器人？", "thought": "只有一台 Pen Pen。剧本末句写的是复数 penguins，可以考虑改成单数。", "ref": "19, C07", "state": "有初步方向"}, {"id": "q5", "text": "Pen Pen 的声音是什么样的？", "thought": "用 ElevenLabs，音色还没定。", "ref": "C07", "state": "尚无方向"}, {"id": "q9", "text": "樱花树三种季节状态（雪压枝 / 新芽 / 满开）怎么保证是同一棵树？", "thought": "先定树的设定图，再在同一个 3D 灰模、同一机位下做季节变体。", "ref": "L02", "state": "尚无方向"}, {"id": "q8", "text": "南极和冰川的家庭录像：全部生成，还是用实拍素材？", "thought": "Super 8 质感可以掩盖一部分生成瑕疵。", "ref": "L06, L07", "state": "尚无方向"}, {"id": "q7", "text": "开衫的连续性：第 3 场穿在李博士身上，第 16 场搭在椅背上被复制体穿走，中间怎么交代？", "thought": "", "ref": "W03, P11", "state": "尚无方向"}]}</script>

<script>
(function(){
"use strict";
const $=(s,el)=> (el||document).querySelector(s);
const $$=(s,el)=> Array.from((el||document).querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TOK_S="__ST"+"ATE__", TOK_T="__T"+"PL__", TOK_F="__F"+"B__";
const STANDALONE=!(window.claude&&typeof window.claude.use==="function");
const FBCFG=(()=>{try{return JSON.parse($("#fbcfg").textContent)}catch(e){return null}})();
const SYNC=STANDALONE&&!!(FBCFG&&FBCFG.databaseURL);
const sync={online:false,ready:false,peers:1,error:"",root:null,last:{},pending:false};
const KEY="smile-for-me-breakdown-draft";
const TPL_B64=$("#tpl").textContent.trim();
const EMBED=JSON.parse($("#state").textContent);
let S=JSON.parse(JSON.stringify(EMBED));
let dirty=false;
if(!SYNC)try{const d=JSON.parse(localStorage.getItem(KEY)||"null"); if(d&&d.rev===EMBED.rev&&d.state){S=d.state;dirty=true;}}catch(e){}
if(!S.breaks)S.breaks={};

const SCENE_STATUS=["草稿","待讨论","已确认"];
const ASSET_STATUS=["待设计","设计中","制作中","已完成","不需要"];
const PRI=["高","中","低"];
const KINDS=["现实","家庭录像","梦境","现实+家庭录像"];
const SEASONS=["冬","晚冬","春","—"];
const IE=["内","外","内/外"];
const STRIP_LEGEND=[["st-int","内景 · 日"],["st-ext","外景 · 日"],["st-night","夜景"],["st-home","家庭录像"],["st-dream","梦境"]];

const ui={view:"scenes",mode:"table",q:"",loc:"",kind:"",status:"",asset:"",cat:"all",aq:"",drawer:null};
let artifactCap=null, downloadsCap=null;

/* ---------- helpers ---------- */
const amap=()=>{const m={};S.assets.forEach(a=>m[a.id]=a);return m};
const catName=id=>(S.cats.find(c=>c.id===id)||{}).name||id;
const shortName=a=>a?a.name.replace(/（.*?）/g,"").replace(/\(.*?\)/g,"").trim():"";
function fmtE(e){e=+e||0;if(!e)return "—";const w=Math.floor(e/8),r=e%8;return (w?w+(r?" ":""):"")+(r?r+"/8":"")}
function stripClass(s){if((s.kind||"").startsWith("家庭录像"))return "st-home";if(s.kind==="梦境")return "st-dream";if(/夜/.test(s.tod||"")&&!/→/.test(s.tod||""))return "st-night";return s.ie==="外"?"st-ext":"st-int"}
function refs(s){const r=new Set(s.assets||[]);if(s.loc)r.add(s.loc);return r}
function scenesFor(id){return S.scenes.filter(s=>refs(s).has(id))}
function statusCls(v){return ({"待讨论":"s-warn","已确认":"s-ok","设计中":"s-info","制作中":"s-warn","已完成":"s-ok","不需要":"s-off"})[v]||""}
function chip(a){return a?`<span class="chip cat-${a.cat}" data-asset="${esc(a.id)}" title="${esc(a.id+" "+a.name)}"><b>${esc(a.id)}</b>${esc(shortName(a))}</span>`:""}
function opts(list,sel,blank){return (blank!=null?`<option value="">${esc(blank)}</option>`:"")+list.map(v=>{const [val,lab]=Array.isArray(v)?v:[v,v];return `<option value="${esc(val)}"${val===sel?" selected":""}>${esc(lab)}</option>`}).join("")}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}
function syncOrder(){const ids=S.scenes.map(s=>s.id);const set=new Set(ids);S.order=(S.order||[]).filter(x=>x.startsWith("b:")?S.breaks[x.slice(2)]!=null:set.has(x));ids.forEach(id=>{if(!S.order.includes(id))S.order.push(id)})}

/* ---------- dirty / save ---------- */
function touch(){if(SYNC){pushSync();return}dirty=true;try{localStorage.setItem(KEY,JSON.stringify({rev:EMBED.rev,state:S}))}catch(e){}renderSave()}
function renderSave(){
  if(SYNC){$("#savestate").classList.toggle("dirty",!sync.online);$("#savetext").textContent=sync.error?sync.error:(sync.online?(sync.ready?"实时同步中 · "+sync.peers+" 人在线":"正在载入共享数据…"):"连接中断，恢复后自动同步");$("#saveBtn").hidden=true;$("#discard").hidden=true;return}
  $("#savestate").classList.toggle("dirty",dirty);
  $("#savetext").textContent=dirty?(artifactCap?"有未保存的修改":(STANDALONE?"修改已存在本浏览器":"修改只暂存在本浏览器")):"已是最新";
  $("#saveBtn").disabled=!dirty||!artifactCap;
  $("#saveBtn").title=artifactCap?"把修改保存到这个页面，所有能打开链接的人都会看到":"当前打开方式不能保存到页面；修改已暂存在本浏览器";
  $("#discard").hidden=!dirty;
}
function b64dec(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function buildHtml(st){const T=b64dec(TPL_B64);const json=JSON.stringify(st).replace(/</g,"\\u003c");return T.replace(TOK_S,()=>json).replace(TOK_T,()=>TPL_B64).replace(TOK_F,()=>$("#fbcfg").textContent)}
$("#saveBtn").addEventListener("click",async()=>{
  if(!artifactCap)return;
  const st=JSON.parse(JSON.stringify(S));st.rev=EMBED.rev+1;
  $("#saveBtn").disabled=true;$("#savetext").textContent="正在保存…";
  try{await artifactCap.publish(buildHtml(st));try{localStorage.removeItem(KEY)}catch(e){}dirty=false;renderSave();toast("已保存到页面")}
  catch(e){const c=e&&e.code;
    if(c==="conflict")toast("页面刚被其他人更新，正在载入最新版本（这次修改未保存）");
    else if(c==="not_granted"||c==="not_writer"){artifactCap=null;toast("你只有查看权限，修改只保存在本浏览器")}
    else toast("保存没有成功："+((e&&e.message)||c||"未知原因")+"，修改仍暂存在本浏览器");
    renderSave()}
});
$("#discard").addEventListener("click",()=>{try{localStorage.removeItem(KEY)}catch(e){}S=JSON.parse(JSON.stringify(EMBED));if(!S.breaks)S.breaks={};dirty=false;closeDrawer();renderAll();toast("已恢复为页面上保存的版本")});

/* ---------- export ---------- */
function exportRows(){
  const m=amap();const names=(s,cat)=>(s.assets||[]).map(id=>m[id]).filter(a=>a&&a.cat===cat).map(a=>a.id+" "+a.name).join("；");
  if(ui.view==="assets"){
    return [["ID","类别","名称","英文","设定要点","出现场次","场次数","镜头合计","制作方式","优先级","状态","备注"]].concat(
      S.assets.map(a=>{const sc=scenesFor(a.id);return [a.id,catName(a.cat),a.name,a.en,a.desc,sc.map(s=>s.no).join(", "),sc.length,sc.reduce((t,s)=>t+(+s.shots||0),0),a.method,a.priority,a.status,a.note]}))
  }

   <div class="grid3">
    <label class="fl"><span>内 / 外</span><select data-f="ie" id="f-ie">${opts(IE,s.ie)}</select></label>
    <label class="fl"><span>时间</span><input data-f="tod" value="${esc(s.tod)}" list="todlist" id="f-tod"></label>
    <label class="fl"><span>季节</span><select data-f="season" id="f-season">${opts(SEASONS,s.season)}</select></label>
    <label class="fl"><span>主场景</span><select data-f="loc" id="f-locd">${opts(sets.map(a=>[a.id,a.id+" "+shortName(a)]),s.loc,"未指定")}</select></label>
    <label class="fl"><span>类型</span><select data-f="kind" id="f-kindd">${opts([...new Set(KINDS.concat([s.kind]))],s.kind)}</select></label>
    <label class="fl"><span>故事日</span><input data-f="day" value="${esc(s.day)}" id="f-day"></label>
   </div>
   <datalist id="todlist"><option value="日"><option value="夜"><option value="晨"><option value="黄昏"><option value="不定"></datalist>
   <label class="fl"><span>内容摘要</span><textarea data-f="summary" id="f-sum" rows="6">${esc(s.summary)}</textarea></label>
   <div class="fl"><span>本场资产（点选添加 / 移除）</span><div id="pk">${pickerHtml(s.assets)}</div></div>
   <label class="fl"><span>备注 / 待思考</span><textarea data-f="note" id="f-note" rows="3">${esc(s.note)}</textarea></label>
   <label class="fl"><span>状态</span><select data-f="status" id="f-st">${opts(SCENE_STATUS,s.status)}</select></label>`;
  $("#dFoot").innerHTML=`<span id="delzone"><button class="btn danger sm" id="delScene">删除此场</button></span><button class="btn primary sm" id="doneScene">完成</button>`;
  const body=$("#dBody");
  body.oninput=body.onchange=ev=>{
    const t=ev.target;
    if(t.id==="f-ew"||t.id==="f-er"){s.eighths=Math.max(0,(parseInt($("#f-ew").value,10)||0)*8+(parseInt($("#f-er").value,10)||0))}
    else if(t.id==="f-shots"){s.shots=Math.max(0,parseInt(t.value,10)||0)}
    else if(t.dataset.f){s[t.dataset.f]=t.value}else return;
    if(t.dataset.f==="no")$("#dTitle").textContent="编辑第 "+s.no+" 场";
    touch();renderMain();
  };
  body.onclick=ev=>{const b=ev.target.closest("[data-pick]");if(!b)return;const aid=b.dataset.pick;const i=s.assets.indexOf(aid);if(i>=0)s.assets.splice(i,1);else s.assets.push(aid);b.setAttribute("aria-pressed",i<0);touch();renderMain()};
  $("#doneScene").onclick=closeDrawer;
  $("#delScene").onclick=()=>{$("#delzone").innerHTML=`<span class="confirm">确定删除第 ${esc(s.no)} 场？<button class="btn danger sm" id="delYes">删除</button><button class="btn sm" id="delNo">取消</button></span>`;
    $("#delYes").onclick=()=>{S.scenes=S.scenes.filter(x=>x.id!==s.id);syncOrder();touch();closeDrawer();renderAll();toast("已删除第 "+s.no+" 场")};
    $("#delNo").onclick=()=>openScene(id)};
  showDrawer("编辑第 "+s.no+" 场");
}
function openAsset(id){
  const a=S.assets.find(x=>x.id===id);if(!a)return;ui.drawer={type:"asset",id};
  const renderLinks=()=>`<div class="picker"><div class="opts">${S.scenes.map(s=>{const on=refs(s).has(a.id);const locked=s.loc===a.id;return `<button type="button" class="opt cat-${a.cat}" data-link="${esc(s.id)}" aria-pressed="${on}" ${locked?'disabled title="这是该场的主场景，请在分场里修改"':`title="${esc(s.slug)}"`}><b>${esc(s.no)}</b></button>`}).join("")}</div></div>`;
  $("#dBody").innerHTML=`
   <div class="grid3">
    <label class="fl"><span>ID</span><input class="mono" id="fa-id" value="${esc(a.id)}"></label>
    <label class="fl"><span>类别</span><select data-f="cat" id="fa-cat">${opts(S.cats.map(c=>[c.id,c.name]),a.cat)}</select></label>
    <label class="fl"><span>优先级</span><select data-f="priority" id="fa-pri">${opts(PRI,a.priority)}</select></label>
   </div>
   <div class="grid2">
    <label class="fl"><span>名称</span><input data-f="name" value="${esc(a.name)}" id="fa-name"></label>
    <label class="fl"><span>英文 / 剧本中的写法</span><input data-f="en" value="${esc(a.en)}" id="fa-en"></label>
   </div>
   <label class="fl"><span>设定要点</span><textarea data-f="desc" id="fa-desc" rows="5">${esc(a.desc)}</textarea></label>
   <div class="grid2">
    <label class="fl"><span>制作方式</span><input data-f="method" value="${esc(a.method)}" id="fa-method" list="methodlist"></label>
    <label class="fl"><span>状态</span><select data-f="status" id="fa-st">${opts(ASSET_STATUS,a.status)}</select></label>
   </div>
   <datalist id="methodlist"><option value="角色设定"><option value="场景设定"><option value="道具设定"><option value="造型变体"><option value="场景陈设"><option value="专项测试"><option value="后期处理"><option value="3D 代理模型"><option value="配音"><option value="音效设计"></datalist>
   <div class="fl"><span>出现场次（点选关联 / 取消）</span><div id="links">${renderLinks()}</div></div>
   <label class="fl"><span>备注 / 待思考</span><textarea data-f="note" id="fa-note" rows="3">${esc(a.note)}</textarea></label>`;
  $("#dFoot").innerHTML=`<span id="delzone"><button class="btn danger sm" id="delAsset">删除此资产</button></span><button class="btn primary sm" id="doneAsset">完成</button>`;
  const body=$("#dBody");
  body.oninput=body.onchange=ev=>{const t=ev.target;if(!t.dataset.f)return;a[t.dataset.f]=t.value;touch();renderMain();if(t.dataset.f==="name")$("#dTitle").textContent=a.id+" "+a.name};
  $("#fa-id").onchange=ev=>{const nid=ev.target.value.trim();if(!nid||nid===a.id)return;if(S.assets.some(x=>x.id===nid)){toast("ID "+nid+" 已存在");ev.target.value=a.id;return}
    const old=a.id;S.scenes.forEach(s=>{s.assets=(s.assets||[]).map(x=>x===old?nid:x);if(s.loc===old)s.loc=nid});if(ui.asset===old)ui.asset=nid;a.id=nid;ui.drawer.id=nid;$("#dTitle").textContent=a.id+" "+a.name;touch();renderMain()};
  body.onclick=ev=>{const b=ev.target.closest("[data-link]");if(!b||b.disabled)return;const s=S.scenes.find(x=>x.id===b.dataset.link);const i=s.assets.indexOf(a.id);if(i>=0)s.assets.splice(i,1);else s.assets.push(a.id);b.setAttribute("aria-pressed",i<0);touch();renderMain()};
  $("#doneAsset").onclick=closeDrawer;
  $("#delAsset").onclick=()=>{const n=scenesFor(a.id).length;$("#delzone").innerHTML=`<span class="confirm">删除 ${esc(a.id)}${n?`（会从 ${n} 场中移除）`:""}？<button class="btn danger sm" id="delYes">删除</button><button class="btn sm" id="delNo">取消</button></span>`;
    $("#delYes").onclick=()=>{S.assets=S.assets.filter(x=>x!==a);S.scenes.forEach(s=>{s.assets=(s.assets||[]).filter(x=>x!==a.id);if(s.loc===a.id)s.loc=""});if(ui.asset===a.id)ui.asset="";touch();closeDrawer();renderAll();toast("已删除 "+a.id)};
    $("#delNo").onclick=()=>openAsset(a.id)};
  showDrawer(a.id+" "+a.name);
}

/* ---------- routing ---------- */
function renderMain(){renderHeader();if(ui.view==="scenes")renderScenes();else if(ui.view==="assets")renderAssets();else renderIssues()}
function renderAll(){renderSave();renderMain()}
function route(){
  const h=(location.hash||"").slice(1);ui.view=["scenes","assets","issues"].includes(h)?h:"scenes";
  $$("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.view===ui.view?"page":"false"));
  $$(".view").forEach(v=>v.hidden=v.id!=="v-"+ui.view);
  renderMain();
}
window.addEventListener("hashchange",route);
syncOrder();renderSave();route();

/* ---------- standalone (opened outside Claude) ---------- */
function blobSave(name,data,type){const a=document.createElement("a");const u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
/* ---------- realtime sync (Firebase Realtime Database) ---------- */
const fkey=id=>String(id).replace(/[.#$\[\]\/]/g,"_");
const toArr=v=>Array.isArray(v)?v.filter(x=>x!=null):(v&&typeof v==="object"?Object.values(v):[]);
function flatten(st){const f={};
  [["assets",st.assets],["scenes",st.scenes],["issues",st.issues]].forEach(([c,list])=>list.forEach((it,i)=>{const b=c+"/"+fkey(it.id)+"/";Object.keys(it).forEach(k=>{const v=it[k];if(v==null||(Array.isArray(v)&&!v.length))return;f[b+k]=v});f[b+"ord"]=i}));
  if(st.order&&st.order.length)f["order"]=st.order;
  Object.keys(st.breaks||{}).forEach(k=>f["breaks/"+fkey(k)]=st.breaks[k]);
  Object.keys(st.meta||{}).forEach(k=>f["meta/"+k]=st.meta[k]);
  f["cats"]=st.cats;return JSON.parse(JSON.stringify(f))}
function nest(f){const o={};Object.keys(f).forEach(p=>{const seg=p.split("/");let c=o;seg.slice(0,-1).forEach(s=>c=c[s]||(c[s]={}));c[seg[seg.length-1]]=f[p]});return o}
function fromRemote(v){const arr=o=>Object.values(o||{}).filter(x=>x&&x.id!=null).sort((a,b)=>(a.ord||0)-(b.ord||0)).map(x=>{const y=Object.assign({},x);delete y.ord;return y});
  return {rev:S.rev,meta:v.meta||S.meta,cats:toArr(v.cats).length?toArr(v.cats):S.cats,
    assets:arr(v.assets).map(a=>Object.assign({name:"",en:"",desc:"",method:"",note:"",priority:"中",status:"待设计"},a)),
    scenes:arr(v.scenes).map(s=>Object.assign({page:"",eighths:0,shots:0,slug:"",loc:"",tod:"",season:"—",kind:"现实",day:"",summary:"",note:"",status:"草稿"},s,{assets:toArr(s.assets)})),
    issues:arr(v.issues).map(i=>Object.assign({text:"",thought:"",ref:"",state:"尚无方向"},i)),
    order:toArr(v.order),breaks:v.breaks||{}}}
function mergeList(local,remote){const by={};local.forEach(x=>by[x.id]=x);const out=remote.map(r=>{const l=by[r.id];if(!l)return r;Object.keys(l).forEach(k=>delete l[k]);return Object.assign(l,r)});local.length=0;out.forEach(x=>local.push(x))}
function pushSync(){if(!sync.root||!sync.ready)return;const f=flatten(S),u={};
  Object.keys(f).forEach(p=>{if(JSON.stringify(f[p])!==JSON.stringify(sync.last[p]))u[p]=f[p]});
  Object.keys(sync.last).forEach(p=>{if(!(p in f))u[p]=null});
  sync.last=f;if(Object.keys(u).length)sync.root.update(u).catch(e=>{sync.error="没有保存成功："+((e&&e.message)||"写入被拒绝");renderSave()})}
function renderAfterRemote(){const a=document.activeElement;if(a&&a.closest&&(a.closest("#issueList")||a.closest("#board"))&&/^(TEXTAREA|INPUT)$/.test(a.tagName)){sync.pending=true;return}sync.pending=false;renderMain()}
document.addEventListener("focusout",()=>{if(sync.pending)setTimeout(()=>{if(sync.pending)renderAfterRemote()},0)});
function applyRemote(v){const n=fromRemote(v);const nf=flatten(n);if(sync.ready&&JSON.stringify(nf)===JSON.stringify(sync.last))return;
  mergeList(S.assets,n.assets);mergeList(S.scenes,n.scenes);mergeList(S.issues,n.issues);S.meta=n.meta;S.cats=n.cats;S.order=n.order;S.breaks=n.breaks;syncOrder();
  sync.last=flatten(S);sync.ready=true;
  if(ui.drawer){const list=ui.drawer.type==="scene"?S.scenes:S.assets;if(!list.some(x=>x.id===ui.drawer.id)){closeDrawer();toast("这一项刚被其他人删除了")}}
  renderSave();renderAfterRemote()}
function startSync(){
  const db=window.firebase.database();sync.root=db.ref("breakdown/v1");
  db.ref(".info/connected").on("value",s=>{sync.online=!!s.val();if(sync.online){const me=db.ref("presence").push();me.onDisconnect().remove();me.set(true)}renderSave()});
  db.ref("presence").on("value",s=>{sync.peers=Math.max(1,s.numChildren());renderSave()});
  sync.root.transaction(cur=>cur===null?nest(flatten(S)):undefined).catch(()=>{}).then(()=>{
    sync.root.on("value",s=>{const v=s.val();if(v)applyRemote(v)},e=>{sync.error="读取共享数据被拒绝，请检查数据库规则";renderSave()})});
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
if(SYNC){
  const V="https://www.gstatic.com/firebasejs/10.12.2/";
  (window.firebase&&window.firebase.database?Promise.resolve():loadScript(V+"firebase-app-compat.js").then(()=>loadScript(V+"firebase-database-compat.js")))
    .then(()=>{if(!window.firebase.apps||!window.firebase.apps.length)window.firebase.initializeApp(FBCFG);startSync()})
    .catch(()=>{sync.error="同步服务载入失败，当前修改不会保存";renderSave()});
}
if(STANDALONE){
  $("#saveBtn").hidden=true;
  (SYNC?["#dlBtn","#expJson"]:["#dlBtn","#impJson","#expJson","#expHtml"]).forEach(s=>$(s).hidden=false);
  $("#expHtml").onclick=()=>{const st=JSON.parse(JSON.stringify(S));st.rev=(EMBED.rev||1)+1+Math.floor(Date.now()/1000);blobSave("SmileForMe_Breakdown.html",buildHtml(st),"text/html");toast("已下载带当前修改的网页文件")};
  $("#expJson").onclick=()=>{blobSave("SmileForMe_Breakdown_数据.json",JSON.stringify(S,null,2),"application/json")};
  $("#impJson").onclick=()=>$("#impFile").click();
  $("#impFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.scenes)||!Array.isArray(d.assets)||!Array.isArray(d.cats))throw 0;S=d;if(!S.breaks)S.breaks={};if(!S.issues)S.issues=[];if(!S.meta)S.meta=EMBED.meta;syncOrder();touch();closeDrawer();renderAll();toast("已导入数据")}catch(_){toast("这个文件不是本页导出的数据文件，没有导入")}e.target.value=""};r.readAsText(f)};
}
/* ---------- capabilities ---------- */
if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("artifact").then(a=>{artifactCap=a||null;renderSave()}).catch(()=>{});
  window.claude.use("downloads").then(d=>{downloadsCap=d||null;$("#dlBtn").hidden=!downloadsCap}).catch(()=>{});
}
})();
</script>
</body>
